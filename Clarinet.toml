[project]
name = "bitbridge"
description = "BitBridge - Decentralized Bitcoin Payment Gateway on Stacks"
authors = ["BitBridge Team"]
telemetry = false
cache_dir = "./.clarinet"

[contracts.bitbridge-payment]
path = "contracts/bitbridge-payment.clar"
clarity_version = 2
epoch = "2.4"

[repl]
costs_version = 2
parser_version = 2

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
